.html" aria-label="進入世志土木"><div class="scene" aria-hidden="true"></div><span class="modeNumber">04/世志土木</span><div class="logoArea"><strong class="gaoshiWordmark">世志<span>土木</span></strong></div><div class="modeMeta"><span>1–4 人</span><span>蓋關卡＋跑關</span><span>同機或各自連線</span></div><p>先放道具坑朋友，<br>自己也要過得去。</p><div class="enter">進入世志土木 <i>↗</i></div></a></main><footer class="footer">很開心可以遇到世志23的大家！</footer></body></html>
