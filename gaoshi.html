<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>世志土木</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{
  --bg:#120e0c; --ink:#f6eedf; --dim:#bfae95; --panel:rgba(20,15,12,.86); --line:rgba(246,238,223,.16);
  --p1:#ff7a3d; --p2:#4fa3ff; --p3:#5fd36a; --p4:#d070e0; --gold:#f2c14e; --bad:#ff5a4f;
  --pixel:"VT323", ui-monospace, "Courier New", monospace;
  --ui:"Noto Sans TC", system-ui, "PingFang TC", sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;pointer-events:none}
.scr[hidden]{display:none}
.scr > *{pointer-events:auto}
.logo{font-weight:900;font-size:clamp(46px,11vw,104px);letter-spacing:.08em;line-height:1;text-shadow:4px 4px 0 #000,0 0 30px rgba(242,193,78,.35);color:var(--gold)}
.sub{font-size:clamp(15px,2.4vw,20px);color:var(--ink);background:var(--panel);padding:4px 16px;border-radius:999px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{min-width:150px;min-height:56px;padding:10px 22px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:20px;font-weight:700}
.big:hover,.big:focus-visible,.big.on{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(242,193,78,.25)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 16px;min-height:40px}
.keys{font-size:14px;color:var(--dim);background:var(--panel);border-radius:12px;padding:10px 14px;line-height:1.7;text-align:center}
.keys b{color:var(--ink)}
kbd{font-family:var(--pixel);font-size:18px;background:#2a221d;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink)}
.scrH{font-family:var(--pixel);font-weight:400;font-size:34px;letter-spacing:.2em;margin:0;text-shadow:2px 2px 0 #000}
/* select */
#scrSelect{justify-content:space-between}
#selBack{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px))}
.selTop{display:flex;flex-direction:column;align-items:center;gap:8px}
.plates{display:flex;justify-content:space-between;width:min(980px,100%);gap:12px}
.plate{background:var(--panel);border:3px solid var(--pc);border-radius:16px;padding:10px 14px;min-width:200px;text-align:center}
.plate .who{font-family:var(--pixel);font-size:24px;color:var(--pc);letter-spacing:.15em}
.plate .nm{font-size:28px;font-weight:900}
.plate .tag{font-size:13px;color:var(--dim);min-height:1.4em}
.plate .st{font-size:14px;margin-top:4px}
.plate.ready{box-shadow:0 0 0 4px rgba(242,193,78,.4)}
.plate.ready .st{color:var(--gold);font-weight:700}
.roster{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:min(980px,100%);background:var(--panel);padding:8px;border-radius:14px}
.roster button{min-height:48px;min-width:64px;padding:4px 10px;border-radius:10px;border:2px solid var(--line);background:#1d1714;font-size:15px;position:relative}
.roster button .mk{display:flex;gap:2px;position:absolute;top:-8px;right:-4px}
.roster button .mk i{font-style:normal;font-family:var(--pixel);font-size:14px;line-height:1;padding:1px 4px;border-radius:4px;color:#000}
/* map select */
.maps{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.mapc{width:220px;min-height:150px;border-radius:16px;border:3px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
.mapc canvas{width:192px;height:108px;border-radius:8px;image-rendering:pixelated;background:#000}
.mapc b{font-size:22px}
.mapc .q{font-size:72px;font-weight:900;line-height:108px;color:var(--gold)}
.mapc.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,193,78,.3)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud[hidden]{display:none}
.hudTop{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;align-items:flex-start;gap:10px;padding:0 10px}
.phase{background:var(--panel);border-radius:999px;padding:4px 18px;font-weight:700;display:flex;gap:10px;align-items:center}
.phase .t{font-family:var(--pixel);font-size:28px;color:var(--gold);min-width:2ch;text-align:right}
.phase .t.low{color:var(--bad)}
.chips{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.chips.l{left:10px}.chips.r{right:10px;align-items:flex-end}
.chip{background:var(--panel);border-left:6px solid var(--pc);border-radius:10px;padding:4px 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.chip b{font-family:var(--pixel);font-size:20px;color:var(--pc)}
.chip .s{color:var(--dim)}
.chip.done .s{color:var(--gold);font-weight:700}
.chip.dead .s{color:var(--bad)}
.tagl{position:absolute;transform:translate(-50%,-100%);font-family:var(--pixel);font-size:20px;line-height:1;color:#000;background:var(--pc);padding:1px 6px;border-radius:6px;white-space:nowrap}
.tagl::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--pc)}
.hint{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:13px;color:var(--dim);background:var(--panel);border-radius:999px;padding:4px 14px;white-space:nowrap}
.flash{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(34px,7vw,72px);text-shadow:4px 4px 0 #000;color:var(--gold);white-space:nowrap;animation:pop .5s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}70%{transform:translate(-50%,-50%) scale(1.12);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
/* sheets */
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:min(560px,100%)}
.sheet .res{font-size:clamp(24px,4.6vw,36px);font-weight:900;text-align:center}
.sheet .why{color:var(--dim);font-size:15px;text-align:center}
.rank{display:flex;flex-direction:column;gap:6px;width:100%}
.rank div{display:flex;gap:10px;align-items:center;border-left:6px solid var(--pc);padding:4px 10px;background:#1d1714;border-radius:8px}
.rank b{font-family:var(--pixel);font-size:22px;color:var(--pc);min-width:2.2em}
.dimmer{background:rgba(10,8,7,.55)}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);z-index:9}
#loading progress{width:min(320px,70vw);height:12px;accent-color:var(--gold)}
#loading[hidden]{display:none}
#touchNote{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:13px;color:var(--dim);background:var(--panel);padding:6px 12px;border-radius:10px;text-align:center}
@media (max-width:640px){.roster .rc{width:60px;min-width:60px}.roster .rc .por{width:50px;height:50px}.plate{min-width:0;flex:1}.plate .nm{font-size:20px}.mapc{width:46vw}.mapc canvas{width:100%;height:auto;aspect-ratio:16/9}}

.roster .rc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 4px 5px;min-width:74px;width:74px}
.roster .rc .por{width:62px;height:62px;border-radius:10px;background:radial-gradient(circle at 50% 35%,#4a3a30,#211915);display:block}
.roster .rc .por.q{display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:var(--gold)}
.roster .rc .cn{font-size:13px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster .rc.rnd .cn{color:var(--gold);font-weight:900}
.skins .rc{width:96px;min-width:96px}
.skins .rc .por{width:82px;height:82px}
.skins .rc .cn{font-size:14px;white-space:normal}
.skins .rc.on{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 40%,transparent)}
.skins .okb{border-color:var(--gold);color:var(--gold);font-weight:700;justify-content:center;font-size:17px}
.roster button:focus-visible,.card:focus-visible,.big:focus-visible,.ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* party box */
#scrPick{justify-content:flex-end;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.pickBox{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:12px 16px;max-width:min(980px,100%)}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{position:relative;width:170px;min-height:190px;border-radius:16px;border:3px solid var(--line);background:#1d1714;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 10px 12px;transition:transform .15s,opacity .2s}
.card canvas{width:88px;height:66px}
.card b{font-size:20px}
.card .ds{font-size:13px;color:var(--dim);text-align:center;line-height:1.35}
.card .cat{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-top:auto}
.card .cat.trap{color:#ff8f6b;border-color:#ff8f6b}
.card .mk{display:flex;gap:2px;position:absolute;top:-10px;right:-6px}
.card .mk i{font-style:normal;font-family:var(--pixel);font-size:16px;line-height:1;padding:2px 5px;border-radius:5px;color:#000}
.card.taken{opacity:.45;transform:scale(.94)}
.card .tk{position:absolute;inset:auto 8px 46px;background:rgba(0,0,0,.8);border-radius:8px;font-weight:900;padding:4px;color:var(--gold)}
/* place labels */
.tagl.bad{background:var(--bad);color:#fff}
.tagl.bad::after{border-top-color:var(--bad)}
/* score bars (each cell = 1/5 point) */
.bar{display:grid;grid-template-columns:repeat(25,1fr);gap:2px;width:150px;margin-top:3px}
.bar i{height:7px;border-radius:2px;background:rgba(246,238,223,.14)}
.bar i.pt{margin-right:3px}
.bar i.f{background:var(--pc)}
.bar i.n{background:var(--pc);animation:fill .3s both;box-shadow:0 0 6px var(--pc)}
@keyframes fill{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.chip{flex-direction:column;align-items:stretch;gap:0}
.chip .top{display:flex;gap:8px;align-items:center}
.sheet.wide{width:min(720px,100%);box-sizing:border-box}
.srows{display:flex;flex-direction:column;gap:10px;width:100%}
.srow{display:grid;grid-template-columns:150px 1fr;grid-template-rows:auto auto;gap:4px 12px;align-items:center;border-left:6px solid var(--pc);background:#1d1714;border-radius:10px;padding:8px 12px}
.srow .nm{display:flex;gap:8px;align-items:center;grid-row:1/3}
.srow .nm b{font-family:var(--pixel);font-size:24px;color:var(--pc)}
.srow .aw{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.srow .aw .a{font-size:14px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--pc);color:#000;animation:pop2 .35s both}
.srow .aw .a.trap{background:#ff8f6b}.srow .aw .a.coin{background:var(--gold)}
.srow .aw .none{color:var(--dim);font-size:14px}
.srow .bar{width:100%;grid-column:2}
.srow .bar i{height:10px}
@keyframes pop2{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@media (max-width:640px){.roster .rc{width:60px;min-width:60px}.roster .rc .por{width:50px;height:50px}.card{width:44vw;min-height:170px}.srow{grid-template-columns:1fr}.srow .nm{grid-row:auto}.srow .bar{grid-column:1}}
@media (prefers-reduced-motion: reduce){.bar i.n,.srow .aw .a,.flash{animation:none}}

/* party box: a wooden crate the cursors reach into */
#scrPick{justify-content:center}
.pickWrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(860px,100%)}
.pbox{position:relative;width:100%;height:min(46vh,380px);border-radius:14px;border:6px solid #4a2e18;
  background:repeating-linear-gradient(90deg,#9a6a3c 0 70px,#8d5f34 70px 74px,#a5743f 74px 150px,#8d5f34 150px 154px);
  box-shadow:inset 0 18px 40px rgba(0,0,0,.45),inset 0 -8px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.5);overflow:visible;touch-action:none}
.pbox .lid{position:absolute;left:-2%;right:-2%;top:-34px;height:30px;border-radius:8px;background:repeating-linear-gradient(90deg,#b07a44 0 90px,#9a6a3c 90px 94px);border:4px solid #4a2e18;transform:rotate(-2.2deg);transform-origin:left bottom}
.pbox .plabel{position:absolute;left:50%;top:-30px;transform:translateX(-50%) rotate(-2deg);font-weight:900;font-size:20px;color:#fff3dc;text-shadow:2px 2px 0 #4a2e18;letter-spacing:.2em;pointer-events:none}
.pitem{position:absolute;transform:translate(-50%,-50%) rotate(var(--tilt));display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px 4px;border-radius:14px;background:rgba(255,243,220,.9);box-shadow:0 6px 0 rgba(0,0,0,.25);border:3px solid var(--pc,transparent);transition:transform .12s,opacity .25s;color:#2a1a10}
.pitem canvas{width:84px;height:63px}
.pitem b{font-size:16px}
.pitem .trap{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:#d4552c;border-radius:999px;padding:0 6px;position:absolute;top:-8px;right:-6px}
.pitem .ds{position:absolute;top:100%;margin-top:8px;width:180px;font-size:12px;line-height:1.35;text-align:center;background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 6px;opacity:0;pointer-events:none;transition:opacity .15s}
.pitem.hot{transform:translate(-50%,-50%) rotate(0) scale(1.1);z-index:2}
.pitem.hot .ds{opacity:1}
.pitem.gone{opacity:0;transform:translate(-50%,-50%) scale(.3)}
.pcur{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:4px solid var(--pc);background:#211915;box-shadow:0 4px 0 rgba(0,0,0,.4);z-index:5;pointer-events:none}
.pcur .por{width:100%;height:100%;border-radius:50%}
.pcur > b{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-family:var(--pixel);font-size:18px;line-height:1;background:var(--pc);color:#000;padding:1px 6px;border-radius:5px}
.pcur::after{content:"";position:absolute;left:-9px;top:-6px;border:9px solid transparent;border-right-color:var(--pc);transform:rotate(45deg)}
.pcur .hold{position:absolute;right:-30px;bottom:-14px;width:44px;height:33px}
.pcur .hold canvas{width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.pcur.got{animation:grab .3s}
@keyframes grab{50%{transform:translate(-50%,-50%) scale(1.25)}}
.smoke{position:absolute;width:0;height:0;z-index:4;pointer-events:none}
.smoke i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fffaf0 0 40%,rgba(255,250,240,.6) 60%,rgba(255,250,240,0) 72%);animation:puff .75s ease-out forwards}
@keyframes puff{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.7);opacity:0}}
/* score board: paper sheet, hatched blocks per award, dashed line per point, solid win line */
#scrScore{gap:12px}
.board{--pad:26px;--who:190px;--tail:120px;--gap:16px;position:relative;width:min(1000px,100%);box-sizing:border-box;padding:18px var(--pad) 40px;background:#e7dcc2;color:#2b2f4a;
  clip-path:polygon(0 1%,3% 0,40% .6%,70% 0,100% 1.2%,99.4% 30%,100% 62%,99.2% 100%,60% 99.2%,30% 100%,.6% 99.4%,0 70%,.8% 35%);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.bhead{display:flex;align-items:baseline;justify-content:center;position:relative;margin-bottom:14px}
.bhead h2{margin:0;font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:.12em}
.bwin{position:absolute;right:calc(var(--tail) - 20px);font-weight:900;font-size:clamp(14px,1.8vw,20px)}
.bgrid{position:absolute;left:calc(var(--pad) + var(--who) + var(--gap));right:calc(var(--pad) + var(--tail) + var(--gap));top:76px;bottom:18px;pointer-events:none}
.bgrid .gl{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(43,47,74,.55)}
.bgrid .gl.solid{border-left:4px solid #2b2f4a}
.bgrid .gl span{position:absolute;bottom:-20px;left:-4px;font-size:13px}
.brow{display:grid;grid-template-columns:var(--who) 1fr var(--tail);gap:var(--gap);align-items:center;min-height:78px;position:relative}
.brow + .brow{margin-top:8px}
.brow .who{display:flex;align-items:center;gap:10px}
.brow .who .por{width:64px;height:64px;border-radius:12px;border:3px solid var(--pc);background:#2a211c}
.brow .nm{display:flex;flex-direction:column;line-height:1.2}
.brow .nm b{font-size:18px}
.brow .nm span{font-size:13px;font-weight:700;color:#a42cc4}
.lane{display:flex;align-items:center;height:56px;position:relative;grid-column:2;overflow:visible;white-space:nowrap}
.seg{flex:0 0 var(--w);height:100%;box-sizing:border-box;border:3px solid var(--c);border-radius:3px;background:repeating-linear-gradient(-45deg,var(--c) 0 3px,transparent 3px 8px);margin-right:1px}
.seg.new{animation:grow .4s ease-out both}
@keyframes grow{from{flex-basis:0;opacity:0}to{flex-basis:var(--w);opacity:1}}
.lane .awbig{font-style:normal;font-weight:900;font-size:clamp(24px,3.4vw,42px);margin-left:12px;animation:pop2 .35s both}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-9deg);background:#ec6a6a;color:#fff;font-weight:900;font-size:clamp(22px,3.6vw,40px);padding:12px 28px;box-shadow:0 8px 0 rgba(0,0,0,.15);animation:stamp .4s .3s both;white-space:nowrap}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-9deg) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(-9deg) scale(1);opacity:1}}
@media (max-width:640px){.board{--pad:14px;--who:110px;--tail:56px;--gap:8px}.brow .who .por{width:40px;height:40px}.brow .nm b{font-size:14px}.lane{height:40px}.pitem canvas{width:60px;height:45px}.pcur{width:44px;height:44px}}
@media (prefers-reduced-motion: reduce){.seg.new,.stamp,.smoke i,.pcur.got{animation:none}}

/* online */
.msg{min-height:1.4em;color:var(--gold);font-size:14px;text-align:center}
.joinRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.joinRow input{font:inherit;font-family:var(--pixel);font-size:32px;width:5ch;text-align:center;letter-spacing:.2em;background:#1d1714;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:4px 8px}
.joinRow input:focus-visible{outline:2px solid var(--gold)}
.lobby{gap:10px}
.lbTop{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.lbCode{font-family:var(--pixel);font-size:72px;line-height:1;letter-spacing:.15em;color:var(--gold)}
#lbQR{width:132px;height:132px;image-rendering:pixelated;border-radius:8px;background:#fff}
.lbLinkRow{display:flex;gap:8px;align-items:center;max-width:100%;font-size:12px;color:var(--dim)}
.lbLinkRow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lbList{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;width:100%}
.lbRow{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-left:6px solid var(--pc);border-radius:12px;padding:6px 10px;background:#1d1714}
.lbRow .por{width:48px;height:48px;border-radius:10px;background:#2a211c}
.lbRow b{display:block;font-size:15px}
.lbRow span{font-size:13px;color:var(--dim)}
.lbRow.ready span{color:var(--gold);font-weight:700}
/* touch controls: thumbs at the bottom corners, info stays out of those corners */
#touch{position:fixed;inset:auto 0 0 0;height:0;z-index:20;pointer-events:none}
.tpad{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;pointer-events:auto;touch-action:none}
.tpad.tl{left:calc(14px + env(safe-area-inset-left,0px));grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px)}
.tpad.tr{right:calc(14px + env(safe-area-inset-right,0px));grid-template-columns:repeat(2,auto);align-items:end}
.tb{width:64px;height:64px;border-radius:50%;border:2px solid rgba(246,238,223,.35);background:rgba(20,15,12,.55);color:var(--ink);font-size:22px;font-weight:900;-webkit-user-select:none;user-select:none;touch-action:none}
.tb.on{background:rgba(242,193,78,.55);border-color:var(--gold)}
.tl .up{grid-column:2;grid-row:1}.tl .lf{grid-column:1;grid-row:2}.tl .rt{grid-column:3;grid-row:2}.tl .dn{grid-column:2;grid-row:2}
.tr .act{width:88px;height:88px;font-size:26px;grid-column:2;grid-row:1/3}
.tr .run.on{background:rgba(79,163,255,.55);border-color:#4fa3ff}
#touch[data-mode="race"] .up,#touch[data-mode="race"] .dn,#touch[data-mode="race"] .rot{display:none}
#touch[data-mode="pick"] .crouch,#touch[data-mode="pick"] .run,#touch[data-mode="pick"] .rot,#touch[data-mode="place"] .crouch,#touch[data-mode="place"] .run{display:none}
#rotHint{display:none}
@media (orientation: portrait) and (pointer: coarse){#rotHint{display:flex;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:rgba(18,14,12,.94);font-size:22px;font-weight:900;color:var(--gold)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading"><div class="logo" style="font-size:48px">世志土木</div><progress id="loadBar" max="1" value="0"></progress><div id="loadStatus" class="sub">正在準備…</div></div>

<section class="scr" id="scrTitle" hidden>
  <div class="logo">世志土木</div>
  <div class="sub">蓋關卡、坑朋友，自己也要過得去</div>
  <div class="row">
    <button class="big" data-players="1">1 人試玩</button>
    <button class="big" data-players="2">2 人同一台</button>
    <button class="big" id="goOnline">跟朋友連線</button>
  </div>
  <div class="msg" id="titleMsg" role="status"></div>
  <div class="keys">
    <b>P1</b>　<kbd>A</kbd><kbd>D</kbd> 移動　<kbd>W</kbd>/<kbd>空白</kbd> 跳　<kbd>左 Shift</kbd> 加速跑　<kbd>S</kbd> 蹲<br>
    <b>P2</b>　<kbd>←</kbd><kbd>→</kbd> 移動　<kbd>↑</kbd>/<kbd>Enter</kbd> 跳　<kbd>右 Shift</kbd> 加速跑　<kbd>↓</kbd> 蹲<br>
    跳躍按越久跳越高；貼著牆按跳可以蹬牆　<kbd>Esc</kbd> 暫停
  </div>
  <a class="ghost" href="index.html" style="text-decoration:none">← 回遊戲首頁</a>
</section>

<section class="scr" id="scrSelect" hidden>
  <div class="selTop"><h2 class="scrH" id="selH">選角色</h2><div class="roster" id="roster"></div><div class="roster skins" id="skins" hidden></div></div>
  <div class="plates" id="plates" style="margin-bottom:env(safe-area-inset-bottom,0px)"></div>
  <button class="ghost" id="selBack">← 返回</button>
</section>

<section class="scr dimmer" id="scrMap" hidden>
  <h2 class="scrH">選地圖</h2>
  <div class="maps" id="maps"></div>
  <div class="keys">P1 用 <kbd>A</kbd><kbd>D</kbd> 選、<kbd>W</kbd> 確定；或直接點地圖</div>
  <button class="ghost" id="mapBack">返回選角</button>
</section>

<section class="scr" id="scrPick" hidden>
  <div class="pickWrap">
    <div class="pbox" id="pbox"><div class="lid"></div><div class="plabel">派對盒</div></div>
    <div class="keys">P1 <kbd>WASD</kbd> 移動、<kbd>空白鍵</kbd> 抓　P2 <kbd>方向鍵</kbd> 移動、<kbd>Enter</kbd> 抓　滑鼠可以幫 P1 抓　<span id="pickNote"></span></div>
  </div>
</section>

<section class="scr dimmer" id="scrScore" hidden>
  <div class="board" id="board">
    <div class="bhead"><h2>世志土木</h2><span class="bwin" id="bWin">獲勝！</span></div>
    <div class="bgrid" id="bgrid"></div>
  </div>
  <button class="big" id="scNext">下一回合</button>
</section>

<div id="hud" hidden>
  <div class="hudTop"><div class="phase"><span id="phaseName">跑到終點旗！</span><span class="t" id="timer">60</span></div></div>
  <div class="chips l" id="chipsL"></div><div class="chips r" id="chipsR"></div>
  <div id="tags"></div>
  <div class="hint" id="hint"></div>
  <div id="flashBox"></div>
</div>

<section class="scr dimmer" id="scrPause" hidden>
  <div class="sheet"><div class="res">暫停</div>
    <div class="row"><button class="big" id="pResume">繼續</button><button class="big" id="pRestart">重新開始</button></div>
    <div class="row"><button class="ghost" id="pMap">換地圖</button><button class="ghost" id="pChar">換角色</button><button class="ghost" id="pTitle">回標題</button></div>
  </div>
</section>

<section class="scr dimmer" id="scrResult" hidden>
  <div class="sheet"><div class="res" id="resTitle"></div><div class="why" id="resWhy"></div><div class="rank" id="resRank"></div>
    <div class="row"><button class="big" id="rRetry">再來一場</button></div>
    <div class="row"><button class="ghost" id="rMap">換地圖</button><button class="ghost" id="rChar">換角色</button><button class="ghost" id="rTitle">回標題</button></div>
  </div>
</section>

<section class="scr dimmer" id="scrOnline" hidden>
  <div class="sheet"><div class="res">跟朋友連線</div>
    <div class="why">每個人用自己的手機或電腦，各自看完整畫面、操作自己的角色</div>
    <div class="row"><button class="big" id="onHost">開房間</button></div>
    <div class="joinRow"><label for="onCode">房號</label><input id="onCode" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 位數"><button class="big" id="onJoin">加入房間</button></div>
    <div class="msg" id="onMsg" role="status"></div>
    <button class="ghost" id="onBack">返回</button>
  </div>
</section>

<section class="scr dimmer" id="scrLobby" hidden>
  <div class="sheet wide lobby">
    <div class="lbTop"><div><div class="why">房號</div><div class="lbCode" id="lbCode">····</div></div><canvas id="lbQR" width="10" height="10" aria-label="加入房間的 QR code"></canvas></div>
    <div class="lbLinkRow"><span id="lbLink"></span><button class="ghost" id="lbCopy">複製連結</button></div>
    <div class="lbList" id="lbList"></div>
    <div class="msg" id="lbStatus" role="status"></div>
    <div class="row"><button class="big" id="lbStart" hidden>開始遊戲</button></div>
    <div class="row"><button class="ghost" id="lbChar">換角色</button><button class="ghost" id="lbLeave">離開房間</button></div>
  </div>
</section>

<div id="touch" hidden>
  <div class="tpad tl">
    <button class="tb up" data-k="KeyW" aria-label="上">▲</button>
    <button class="tb lf" data-k="KeyA" aria-label="左">◀</button>
    <button class="tb rt" data-k="KeyD" aria-label="右">▶</button>
    <button class="tb dn" data-k="KeyS" aria-label="下">▼</button>
  </div>
  <div class="tpad tr">
    <button class="tb act" id="tAct" data-k="Space">跳</button>
    <button class="tb crouch" data-k="KeyS">蹲</button>
    <button class="tb run" id="tRun" aria-pressed="true">跑</button>
    <button class="tb rot" data-k="KeyE">轉</button>
  </div>
</div>
<div id="rotHint">請把手機轉成橫向</div>

<script>
(async()=>{
  const V = (location.search.match(/[?&]v=([^&]*)/)||[])[1], version = '?v=' + (V || '20261027a');
  const bar = document.getElementById('loadBar'), status = document.getElementById('loadStatus');
  const script = (src)=>new Promise((ok, no)=>{ const s = document.createElement('script'); s.src = src.startsWith('http') ? src : src + version; s.onload = ok; s.onerror = ()=>no(new Error('無法載入 ' + src)); document.head.appendChild(s); });
  try{
    await script('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');
    try { await script('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'); } catch(e){ console.warn(e); }   // online play only
    try { await script('js/qrcode.js'); } catch(e){ console.warn(e); }
    await script('js/gaoshi-rules.js'); await script('js/gaoshi-physics.js'); await script('js/gaoshi-maps.js');
    await script('js/gaoshi-scene.js'); await script('js/gaoshi-models.js');
    // roster follows 世志大亂鬥: read its character list so new characters show up here too
    let names = ['waffle','tommy','karl','seafood','bear','serene','kiafes','newton','kattisbbb','jackson','janice','masterogway','kelsey','wxinyy','jennie','pudding','xuan','ichung'];
    try { const html = await (await fetch('brawl.html' + version, {cache:'no-cache'})).text(); const found = [...html.matchAll(/S\('characters\/([a-z]+)\.js'\)/g)].map(m=>m[1]); if (found.length) names = found; } catch(_){}
    bar.max = names.length + 1; status.textContent = '正在準備角色…';
    for (const n of names){ try { await script('characters/' + n + '.js'); } catch(e){ console.warn(e); } bar.value++; }
    await script('js/gaoshi-art.js'); await script('js/gaoshi-net.js'); await script('js/gaoshi.js'); bar.value++;
    GaoshiGame.boot(); document.getElementById('loading').hidden = true;
  }catch(e){ status.textContent = '載入失敗：' + e.message + '，請重新整理'; console.error(e); }
})();
</script>
</body>
</html>
